services:
  discord:
    build: ./
    # image: ghcr.io/taichikuji/sakamoto:latest
    restart: unless-stopped
    mem_limit: 512m
    # Matching the memory limit disables container swap.
    memswap_limit: 512m
    container_name: sakamoto
    environment:
      - TOKEN=${TOKEN}
      - STEAM_TOKEN=${STEAM_TOKEN}
    volumes:
      - sakamoto_db:/usr/src/app/data
    # Label for Watchtower to detect the service to update.
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"

  # Uncomment the following section, the image above, and the discord label
  # to enable automatic updates with the maintained Watchtower fork.
  # updater:
  #   image: nickfedor/watchtower:latest
  #   container_name: sakamoto-updater
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_LABEL_ENABLE: "true"
  #     WATCHTOWER_CLEANUP: "true"
  #     WATCHTOWER_SCHEDULE: "${WATCHTOWER_SCHEDULE:-0 0 0 * * *}"
  #     WATCHTOWER_NOTIFICATION_URL: "${WATCHTOWER_NOTIFICATION_URL}"
  #     WATCHTOWER_NOTIFICATION_REPORT: "true"

volumes:
  sakamoto_db:
